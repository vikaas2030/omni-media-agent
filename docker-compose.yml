services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # GPU (optional): uncomment on a CUDA host
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  worker:
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      FFMPEG_PATH: ffmpeg
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    env_file:
      - .env
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - redis
      - ollama
    restart: unless-stopped

  # Optional local image generation — start with: docker compose --profile images up
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest
    profiles: ["images"]
    volumes:
      - comfyui-models:/data
    restart: unless-stopped

volumes:
  ollama:
  comfyui-models:
