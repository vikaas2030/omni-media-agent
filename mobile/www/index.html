<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Omni Media Agent</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0b1020; color: #e2e8f0; margin: 0; }
  .setup { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 32px; box-sizing: border-box; }
  .setup img { width: 108px; border-radius: 24px; margin-bottom: 20px; }
  .setup h1 { font-size: 22px; margin: 0 0 6px; }
  .setup p.sub { color: #8ea0bf; font-size: 13px; margin: 0 0 26px; text-align: center; }
  input { width: 100%; max-width: 380px; background: #131a2e; color: #e2e8f0; border: 1px solid #24304f;
    border-radius: 10px; padding: 14px; font-size: 15px; box-sizing: border-box; outline: none; }
  input:focus { border-color: #0ea5e9; }
  button { margin-top: 14px; background: #059669; color: #fff; border: 0; border-radius: 10px;
    padding: 14px 34px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { background: #1f3b33; }
  .err { color: #f87171; font-size: 13px; margin-top: 14px; text-align: center; max-width: 380px; }
  .hint { color: #64748b; font-size: 12px; margin-top: 26px; text-align: center; max-width: 340px; line-height: 1.6; }
  #appView { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; background: #0b1020; }
  #gear { position: fixed; top: 10px; right: 10px; z-index: 10; background: rgba(11,16,32,0.85);
    color: #e2e8f0; border: 1px solid #24304f; border-radius: 999px; width: 38px; height: 38px;
    font-size: 17px; cursor: pointer; display: none; }
</style></head><body>
<div class="setup" id="setup">
  <img src="icon-192.png" alt="Omni Media Agent">
  <h1>🎬 Omni Media Agent</h1>
  <p class="sub">अपने self-hosted server से connect करो — आपका hardware, $0 credits</p>
  <input id="serverUrl" type="url" placeholder="http://192.168.1.5:3000" autocapitalize="off" autocorrect="off">
  <button id="connectBtn" onclick="connect()">Connect</button>
  <div class="err" id="err"></div>
  <div class="hint">Server URL वही है जहाँ dashboard चलता है (docker/VPS/Colab)।<br>
  Tip: फ़ोन और server एक ही WiFi/network पर हों या server public HTTPS पर हो।</div>
</div>
<iframe id="appView" src="about:blank"></iframe>
<button id="gear" onclick="showSetup()">⚙</button>
<script>
const KEY = 'omnia.server';
let currentServer = localStorage.getItem(KEY) || '';
document.getElementById('serverUrl').value = currentServer;

function showSetup() {
  document.getElementById('appView').style.display = 'none';
  document.getElementById('gear').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
}

async function connect() {
  const btn = document.getElementById('connectBtn');
  const err = document.getElementById('err');
  let url = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
  if (!url) { err.textContent = 'Server URL डालो'; return; }
  if (!/^https?:\/\//.test(url)) url = 'http://' + url;
  btn.disabled = true; btn.textContent = 'Connecting…'; err.textContent = '';
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    const r = await fetch(url + '/api/queue', { signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    localStorage.setItem(KEY, url);
    currentServer = url;
    openApp();
  } catch (e) {
    err.textContent = 'Connect नहीं हुआ: ' + (e.name === 'AbortError' ? 'timeout' : e.message) +
      '। सुनिश्चित करो कि server चल रहा है और URL सही है।';
  } finally {
    btn.disabled = false; btn.textContent = 'Connect';
  }
}

function openApp() {
  document.getElementById('setup').style.display = 'none';
  const view = document.getElementById('appView');
  view.src = currentServer + '/';
  view.style.display = 'block';
  document.getElementById('gear').style.display = 'block';
}

if (currentServer) openApp();
</script></body></html>
